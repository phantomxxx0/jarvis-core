services:

  postgres:
    image: postgres:17
    container_name: jarvis-postgres
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - ../data/postgres:/var/lib/postgresql/data

    networks:
      - jarvis


  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}

    env_file:
      - ../.env

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - ../data/redis:/data

    networks:
      - jarvis


  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      QDRANT__SERVICE__API_KEY: 2026PhantomXYZ

    ports:
      - "${QDRANT_PORT}:6333"

    volumes:
      - ../data/qdrant:/qdrant/storage

    networks:
      - jarvis


  tika:
    image: apache/tika:3.2.3.0
    container_name: jarvis-tika
    restart: unless-stopped

    ports:
      - "9998:9998"

    networks:
      - jarvis


networks:
  jarvis:
    name: jarvis-network
